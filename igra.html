<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формула 1 - едноставна игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Формула 1</h1>
    <p>Трка со 10 возачи и 10 круга.</p>

    <button onclick="sledenKrug()" id="kopce">Следен круг</button>
    <button onclick="novaTrka()">Нова трка</button>

    <h2 id="krug">Круг: 0 / 10</h2>
    <p id="poraka">Притисни „Следен круг“ за да започне трката.</p>

    <h3 id="naslovPred">Состојба пред почетокот</h3>
    <div class="tabela">
        <table>
            <thead>
                <tr>
                    <th>Место</th><th>Возач</th><th>Тим</th>
                    <th>Брзина</th><th>Вештина</th><th>Гуми</th>
                    <th>Вкупно време (с)</th><th>Статус</th>
                </tr>
            </thead>
            <tbody id="pred"></tbody>
        </table>
    </div>

    <h3 id="naslovPo">Состојба по кругот</h3>
    <div class="tabela">
        <table>
            <thead>
                <tr>
                    <th>Место</th><th>Возач</th><th>Тим</th>
                    <th>Брзина</th><th>Вештина</th><th>Гуми</th>
                    <th>Вкупно време (с)</th><th>Статус</th>
                </tr>
            </thead>
            <tbody id="po">
                <tr><td colspan="8">Трката сè уште не започнала.</td></tr>
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
